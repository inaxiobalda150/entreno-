<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camino a Monegros</title>
<meta name="theme-color" content="#0E1209">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1209;--card:#162013;--card2:#1c2a17;--border:#26361D;--ink:#F2F5EC;--muted:#8A9C7C;--accent:#8CBF5A;--warn:#C8A84A;--orange:#D4784E;--blue:#5AACCE;--violet:#A78BFA;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'DM Sans',system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3,.bebas{font-family:'Bebas Neue','DM Sans',sans-serif;font-weight:400;letter-spacing:.04em;margin:0}
#main{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
.mut{color:var(--muted)}.small{font-size:12.5px}
.sec{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card.btn{display:block;width:100%;text-align:left}
.card.ok{border-color:#3d5a28;background:#1a2915}
.card.warn{border-color:#6b5a22;background:#272212}
.card.note{border-left:4px solid var(--accent)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--accent)) 20%,transparent);color:var(--c,var(--accent))}
.big{display:block;width:100%;background:var(--accent);color:#0E1209;font-weight:700;font-size:16px;border-radius:12px;padding:14px;text-align:center}
.big.ghost{background:transparent;border:1px solid var(--border);color:var(--ink)}
.big[disabled]{opacity:.4}
.sm{display:inline-block;background:var(--accent);color:#0E1209;font-weight:700;font-size:13px;border-radius:9px;padding:8px 14px}
.sm.ghost{background:transparent;border:1px solid var(--border);color:var(--ink)}
/* hero */
.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.top .d{font-size:13px;color:var(--muted)}
.top h1{font-size:34px;line-height:1}
.hero{background:linear-gradient(160deg,#1f3317,#121b0e);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.hero .cnt{font-family:'Bebas Neue';font-size:76px;line-height:.9;color:var(--accent)}
.hero .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bar{height:8px;background:#0b0f07;border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.week div{cursor:pointer;text-align:center;padding:8px 0;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:11px;color:var(--muted)}
.week div b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.week .hoy{border-color:var(--accent)}.week .fin{background:#1d2f15}
.week i{display:block;font-style:normal;font-size:11px;height:14px}
.ic{font-size:28px;width:44px;text-align:center;flex:none}
.tag{font-size:10px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.chk{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px;color:#0E1209}
.on .chk,.chk.on{background:var(--accent);border-color:var(--accent)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:#0b0f07;border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600}
nav button span{font-size:21px;line-height:1}
nav button.on{color:var(--accent)}
/* overlay */
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.ov .hd{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--border)}
.ov .hd .back{font-size:30px;line-height:1;width:38px;color:var(--accent)}
.ov .hd b{font-family:'Bebas Neue';font-size:22px;letter-spacing:.04em;font-weight:400}
.ov .hd span{display:block;font-size:12px;color:var(--muted)}
.ov .bd{flex:1;overflow-y:auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;width:100%}
.ov.sheet{background:rgba(0,0,0,.6);justify-content:flex-end}
.ov.sheet .box{background:var(--bg);border-radius:18px 18px 0 0;max-height:88%;display:flex;flex-direction:column;border:1px solid var(--border)}
/* entreno */
.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.exrow img,.thumb{width:68px;height:52px;object-fit:cover;border-radius:8px;background:#fff;flex:none}
.photo{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:12px;display:block}
.set{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.set.ok{background:#1a2915;border-color:#3d5a28}
.set .n{font-family:'Bebas Neue';font-size:22px;width:20px;color:var(--muted)}
.stp{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:2px}
.stp button{width:38px;height:42px;font-size:22px;color:var(--accent)}
.stp span{font-weight:700;font-size:16px;text-align:center;min-width:44px}
.stp small{font-weight:400;color:var(--muted);font-size:11px}
.set .go{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--muted);font-size:20px;flex:none}
.set.ok .go{background:var(--accent);border-color:var(--accent);color:#0E1209}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.feel button{padding:12px 4px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-weight:600;font-size:13px}
.feel button.on{border-color:var(--accent);background:#1c2a14;color:var(--accent)}
.rest{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;background:#0b0f07;border:1px solid var(--accent);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;max-width:536px;margin:0 auto}
.rest b{font-family:'Bebas Neue';font-size:38px;font-weight:400;color:var(--accent);min-width:64px}
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:21;max-width:560px;margin:0 auto}
/* recetas */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:#0E1209}
.rcard{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px}
.rtop{padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left}
.remoji{font-size:26px;width:34px;text-align:center;flex:none}
.rname{font-size:14px;font-weight:600}
.rmeta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.rchev{color:var(--muted);transition:transform .15s}
.rcard.open .rchev{transform:rotate(180deg)}
.rbody{display:none;padding:0 14px 14px;flex-direction:column;gap:10px}
.rcard.open .rbody{display:flex}
.rbtn{align-self:flex-start;font-size:12px;font-weight:700;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--muted)}
.rbtn.on{border-color:var(--accent);background:#1c2a14;color:var(--accent)}
.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.macro div{background:var(--bg);border-radius:10px;padding:8px 2px}
.macro b{display:block;font-family:'Bebas Neue';font-size:24px;font-weight:400}
.macro span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ccat{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px}
.chdr{padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between}
.cc-prot .chdr{background:rgba(212,120,78,.1);color:var(--orange)}
.cc-veg .chdr{background:rgba(140,191,90,.1);color:var(--accent)}
.cc-carb .chdr{background:rgba(200,168,74,.1);color:var(--warn)}
.cc-extra .chdr{background:rgba(90,172,206,.1);color:var(--blue)}
.citem{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left}
.citem.on .tx{text-decoration:line-through;color:var(--muted)}
/* camino */
.road{position:relative;margin:0 -4px}
.road svg{width:100%;display:block}
.wk{cursor:pointer}
/* progreso */
.chart{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:600}
.chip.on{border-color:var(--accent);background:#1c2a14;color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld textarea,.fld select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px;font-size:16px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:#0b0f07;border:1px solid var(--accent);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;max-width:90%;text-align:center}
.pulse{animation:p 1.6s infinite}
@keyframes p{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
ul.l,ol.l{margin:6px 0;padding-left:20px}.l li{margin:4px 0}
/* estilo lámina */
.lam{background:#F2F5EC;color:#0E1209;border-radius:14px;padding:16px 16px 14px;margin-bottom:10px;border-bottom:6px solid var(--c)}
.lam-t{font-family:'Bebas Neue';font-size:44px;line-height:.95;text-transform:uppercase;letter-spacing:.02em}
.lam-s{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#4a5a3e;margin-top:4px}
.lam-n{font-family:'Bebas Neue';font-size:24px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.nb{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:'Bebas Neue';font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.nb.sm2{width:22px;height:22px;font-size:14px;position:absolute;top:6px;left:6px}
.sr{background:#0b0f07;border:1px solid var(--border);color:var(--accent);font-family:'Bebas Neue';font-size:18px;letter-spacing:.04em;padding:4px 10px;border-radius:8px;white-space:nowrap;flex:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 8px}
.pair div{position:relative;background:#fff;border-radius:10px;overflow:hidden}
.pair img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block}
.pair span{position:absolute;left:6px;bottom:6px;background:#0E1209;color:#F2F5EC;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.gst{position:relative;background:#fff;border-radius:10px;overflow:hidden;color:#0E1209}
.gst img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.gst b{display:block;font-size:11px;padding:4px 6px 6px;line-height:1.2;min-height:30px}
.dots{display:flex;gap:4px;margin-bottom:14px}
.dots button{flex:1;height:6px;border-radius:99px;background:var(--border)}
.dots button.ok{background:#3d5a28}.dots button.on{background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;text-align:center}
.stats div{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 2px}
.stats b{display:block;font-family:'Bebas Neue';font-size:26px;font-weight:400;color:var(--accent)}
.stats span{font-size:10px;color:var(--muted)}
.thumb.ico{display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--bg)}
label.sm{cursor:pointer}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tres button{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 4px;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tres span{font-size:26px;line-height:1}.tres small{color:var(--muted);font-weight:400;font-size:11px}
.drow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);font-size:14px}
.drow:last-child{border-bottom:0}.drow b{width:44px;flex:none;color:var(--muted)}.drow.hoy{background:#1c2a14}.drow.hoy b{color:var(--accent)}
.target{background:#F2F5EC;color:#0E1209;border-radius:12px;padding:14px;margin:4px 0 12px;font-size:17px;line-height:1.4}
.target .mut{color:#4a5a3e}
.setb{display:flex;align-items:center;width:100%;min-height:60px;padding:0 16px;margin-bottom:8px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);font-weight:700;font-size:17px}
.setb .ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.setb.ok{background:#1a2915;border-color:var(--accent)}.setb.ok .ck{background:var(--accent);border-color:var(--accent);color:#0E1209}
</style>
</head>
<body>
<div id="main"></div>
<script src="data.js"></script>
<script src="plan.js"></script>
<script src="app.js"></script>
</body>
</html>
