<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach Iñaki</title>
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1720;--card:#18222e;--card2:#1f2b39;--line:#2a3747;--tx:#eef2f6;--mut:#93a3b5;--acc:#f97316;--ok:#22c55e;--warn:#eab308;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,sans-serif}
#main{padding:calc(14px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
h2,h3,.hero .count b,.stats b,.kcal b,.reloj b,.rest b{font-family:'Barlow Condensed',Inter,sans-serif;letter-spacing:.3px}
h2{font-size:30px;margin:6px 0 12px}h3{font-size:22px;margin:18px 0 8px}h4{margin:16px 0 6px;font-size:16px}
p{margin:6px 0}.mut{color:var(--mut);font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 10px}
.card.note{border-left:4px solid var(--acc)}.card.warn{border-color:var(--warn);background:#2a2410}
.card.gem{background:#1c2a22;border-color:#2f5a3f;font-size:15px}.card.sug{background:var(--card2);font-size:15px}
.card.warm{background:#2a1c12;border-color:#5a3418;font-size:15px}
.item,.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.item .ic{font-size:28px;width:44px;text-align:center;flex:none}
.item .tx,.exrow .tx{flex:1;display:flex;flex-direction:column;min-width:0}
.item .tx span,.exrow .tx span{color:var(--mut);font-size:14px}
.item .st,.exrow .st{font-size:22px;color:var(--mut)}
.item.ok,.exc.ok{border-color:#2f5a3f;background:#16261e}
.item.gym{border-left:4px solid var(--acc)}.item.out{border-left:4px solid #38bdf8}.item.str{border-left:4px solid #a78bfa}
.exrow img{width:72px;height:52px;object-fit:cover;border-radius:8px;flex:none;background:#fff}
.exrow .prog{color:var(--acc)!important;font-weight:600}
.hero{background:linear-gradient(135deg,#1f2b39,#13202c);border-radius:18px;padding:16px;margin-bottom:6px;border:1px solid var(--line)}
.hero .date{font-size:15px;color:var(--mut)}
.ph{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);font-weight:600;font-size:14px}
.hero .count{margin-top:8px;color:var(--mut)}.hero .count b{font-size:44px;color:var(--tx);line-height:1}
.btn{background:var(--acc);color:#111;font-weight:700;border-radius:12px;padding:12px 16px}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:8px 12px;font-size:14px}.btn.wide{width:100%;margin:6px 0}.btn.big{padding:16px;font-size:18px;margin-top:14px}
.btn.sel,.btn.ghost.sel{background:var(--acc);color:#111;border-color:var(--acc)}
.btn.danger{color:#fca5a5;border-color:#5a2a2a}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row .btn{flex:1}
.row input{flex:2;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1118f2;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut)}
nav button i{font-style:normal;font-size:22px}nav button.on{color:var(--acc)}
.over{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto}
.ohead{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#0b1118f2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:2}
.ohead>div{display:flex;flex-direction:column;flex:1;min-width:0}.ohead span{color:var(--mut);font-size:13px}
.back{font-size:30px;width:40px;height:40px;line-height:1;border-radius:10px;background:var(--card2);flex:none}
.obody{padding:14px 14px calc(110px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
.reloj{display:flex;align-items:center;gap:8px}.reloj b{font-size:26px;min-width:56px;text-align:right}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pics img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;background:#fff}
.piclab{display:grid;grid-template-columns:1fr 1fr;text-align:center;color:var(--mut);font-size:13px;margin:2px 0 4px}
.anim{position:relative;aspect-ratio:3/2;margin:10px 0;border-radius:12px;overflow:hidden;background:#fff}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.anim img.b{animation:fade 2.4s infinite}
@keyframes fade{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
ol,ul{padding-left:22px;margin:6px 0}li{margin:4px 0}ul.err li{color:#fca5a5}
.sets{margin:10px 0}.set{display:flex;align-items:flex-end;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.set.ok{background:#16261e;border-color:#2f5a3f}
.set .sn{width:28px;height:28px;margin-bottom:8px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;flex:none}
.set label{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut)}
.set input{width:100%;font:600 20px Inter;text-align:center;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.chk{width:48px;height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:22px;flex:none}
.set.ok .chk{background:var(--ok);color:#06210f;border-color:var(--ok)}
.rest{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:10px;background:#111c27;border:1px solid var(--acc);border-radius:16px;padding:10px 12px;box-shadow:0 8px 30px #0008;max-width:600px;margin:0 auto}
.rest span{color:var(--mut)}.rest b{font-size:30px;flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#eef2f6;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:90%;text-align:center;box-shadow:0 6px 20px #0006}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-bottom:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column}
.stats b{font-size:30px;line-height:1.1}.stats span{color:var(--mut);font-size:12px}
.kcal{display:flex;align-items:baseline;gap:8px}.kcal b{font-size:48px;line-height:1}.kcal span{color:var(--mut)}
.macro{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:10px 0;gap:2px}
.mrow{display:flex;gap:8px}.mrow div{flex:1;display:flex;flex-direction:column;text-align:center}.mrow span{color:var(--mut);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{padding:7px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:14px}
.chips button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
.chips.big button{width:44px;height:44px;padding:0;font-weight:700;font-size:17px}
.wnav{display:flex;align-items:center;gap:10px;margin-bottom:10px}.wnav>div{flex:1;text-align:center;display:flex;flex-direction:column}.wnav span{color:var(--mut);font-size:13px}
.search{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px}
.lab{display:flex;flex-direction:column;gap:6px;margin:14px 0 6px;color:var(--mut);font-size:14px}
.lab input{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:20px;font-weight:600}
.card.opt{font-size:17px;font-weight:600;padding:16px}.card.opt.sel{border-color:var(--acc);background:#2a1c12}
.barra{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-bottom:14px}.barra span{display:block;height:100%;background:var(--acc);transition:width .3s}
.calc{text-align:center;padding:60px 0}.spin{width:48px;height:48px;border:4px solid var(--card2);border-top-color:var(--acc);border-radius:50%;margin:0 auto 16px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.chart{width:100%;height:auto;margin-top:8px}.chart .cl{fill:var(--mut);font-size:10px}.chart .cv{fill:var(--tx);font-size:10px;font-weight:600}
.seg .btn{padding:8px 4px;font-size:13px}
.lvl{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.lnum{width:48px;height:48px;border-radius:50%;background:var(--acc);color:#2a1405;display:grid;place-items:center;font:700 24px 'Barlow Condensed',Inter;flex:none;animation:pop .6s ease}
.linfo{flex:1;min-width:0}.linfo small,.lrac small{color:var(--mut);font-size:12px}
.lbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 3px}.lbar span{display:block;height:100%;background:var(--acc);border-radius:99px;animation:grow 1s ease}
.lrac{text-align:center;display:flex;flex-direction:column}.lrac b{font-size:24px;line-height:1}
.fecha{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 10px;color:var(--mut);font-size:15px}.fecha .ph{margin:0}
.rings{display:flex;justify-content:space-around;margin:4px 0 12px}
.ring{display:flex;flex-direction:column;align-items:center;width:31%}.ring svg{width:100%;max-width:96px}.ring text{fill:var(--tx);font:700 17px 'Barlow Condensed',Inter}.ring span{color:var(--mut);font-size:12px;margin-top:2px}
.rarc{animation:ring 1.2s cubic-bezier(.2,.8,.2,1)}
@keyframes ring{from{stroke-dashoffset:var(--L)}}@keyframes grow{from{width:0}}@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.hoy{margin-bottom:10px}.hcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:10px}
.hcard.ok{border-color:#2f5a3f}.hfoto{position:relative;display:flex;height:150px;background:#fff;cursor:pointer}
.hfoto img{flex:1;min-width:0;object-fit:cover;height:100%}.hfoto img+img{border-left:2px solid var(--card)}
.hfoto.big{background:#13283a;align-items:center;justify-content:center}.hcard.out .hfoto{background:#13283a}.hic{font-size:64px}
.hpill{position:absolute;left:10px;bottom:10px;background:var(--acc);color:#2a1405;font-weight:700;font-size:14px;padding:4px 12px;border-radius:99px}
.hcard.out .hpill{background:#38bdf8;color:#04263a}
.hbody{display:flex;align-items:center;gap:12px;padding:12px 14px}.hbody>div{flex:1;display:flex;flex-direction:column}.hbody small{color:var(--mut);font-size:13px}.hbody .st{font-size:26px;color:var(--ok)}
.chead{display:flex;justify-content:space-between;align-items:baseline}.chead span{color:var(--acc);font-weight:700}
.camino svg{width:100%;display:block;margin:6px 0}.ctrazo{stroke-dasharray:600;animation:draw 1.6s ease}@keyframes draw{from{stroke-dashoffset:600}}
.reto.ok{border-color:#2f5a3f;background:#16261e}.reto.ok .lbar span{background:var(--ok)}
.meds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.med{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 4px;border-radius:12px;border:1px dashed var(--line);filter:grayscale(1);opacity:.55}
.med.on{filter:none;opacity:1;border:1px solid var(--warn);background:#2a2410}.med span{font-size:26px}.med small{font-size:11px;color:var(--mut);line-height:1.2}.med.on small{color:var(--warn)}
.medgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.med.big span{font-size:36px}.med.big b{font-size:14px}
.celeb{position:fixed;inset:0;z-index:40;background:#000a;display:grid;place-items:center;padding:20px}
.cbox{background:var(--card);border:1px solid var(--acc);border-radius:22px;padding:22px;max-width:380px;width:100%;text-align:center;animation:pop .5s ease}
.cniv{width:84px;height:84px;margin:0 auto;border-radius:50%;background:var(--acc);color:#2a1405;display:grid;place-items:center;font:700 44px 'Barlow Condensed',Inter}
.cbig{font:700 30px 'Barlow Condensed',Inter;color:var(--acc);margin:0 0 8px}
.cmed{display:flex;align-items:center;gap:12px;text-align:left;background:#2a2410;border:1px solid var(--warn);border-radius:14px;padding:10px;margin:8px 0}.cmed span{font-size:40px}.cmed p{margin:2px 0 0}
.confeti{position:fixed;inset:0;z-index:50;pointer-events:none}

</style>
</head>
<body>
<main id="main"></main>
<nav>
  <button data-t="hoy"><i>🏠</i>Hoy</button>
  <button data-t="plan"><i>📅</i>Plan</button>
  <button data-t="comida"><i>🍽️</i>Comida</button>
  <button data-t="progreso"><i>📈</i>Progreso</button>
  <button data-t="ajustes"><i>⚙️</i>Ajustes</button>
</nav>
<script src="data.js"></script>
<script src="juego.js"></script>
<script src="app.js"></script>
</body>
</html>
