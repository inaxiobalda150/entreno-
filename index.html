<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entreno Iñaki</title>
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1720;--card:#18222e;--card2:#1f2b39;--line:#2a3747;--tx:#eef2f6;--mut:#93a3b5;--acc:#f97316;--ok:#22c55e;--warn:#eab308;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,sans-serif}
#main{padding:calc(14px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
h2,h3,.hero .count b,.tn,.big2{font-family:'Barlow Condensed',Inter,sans-serif;letter-spacing:.3px}
h2{font-size:30px;margin:6px 0 12px}h3{font-size:22px;margin:18px 0 8px}h4{margin:14px 0 6px;font-size:16px}
p{margin:6px 0}.mut{color:var(--mut);font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 10px}
.card.note{border-left:4px solid var(--acc)}.card.warn{border-color:var(--warn);background:#2a2410}
.card.gem{background:#1c2a22;border-color:#2f5a3f;font-size:15px}.card.sug{background:var(--card2);font-size:15px}
.card.warm{background:#2a1c12;border-color:#5a3418}
.item,.exrow{display:flex;align-items:center;gap:12px}
.item .ic,.exrow .ic{font-size:28px;width:44px;text-align:center;flex:none}
.item .tx,.exrow .tx{flex:1;display:flex;flex-direction:column;min-width:0}
.item .tx span,.exrow .tx span{color:var(--mut);font-size:14px}
.item em{color:var(--acc);font-style:normal;font-size:13px;font-weight:600}
.item .st,.exrow .st{font-size:22px;color:var(--mut)}
.item.ok,.exrow.ok{border-color:#2f5a3f;background:#16261e}
.item.gym{border-left:4px solid var(--acc)}.item.out{border-left:4px solid #38bdf8}.item.str{border-left:4px solid #a78bfa}
.exrow img{width:72px;height:52px;object-fit:cover;border-radius:8px;flex:none;background:#fff}
.exrow .prog{color:var(--acc)!important;font-weight:600}
.hero{background:linear-gradient(135deg,#1f2b39,#13202c);border-radius:18px;padding:16px;margin-bottom:6px;border:1px solid var(--line)}
.hero .date{font-size:15px;color:var(--mut)}
.hero .ph{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);font-weight:600;font-size:14px}
.hero .count{margin-top:8px;color:var(--mut)}.hero .count b{font-size:44px;color:var(--tx);line-height:1}
.btn{background:var(--acc);color:#111;font-weight:700;border-radius:12px;padding:12px 16px}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:8px 14px}.btn.wide{width:100%;margin:6px 0}.btn.big{padding:16px;font-size:18px;margin-top:14px}
.btn.sel{background:var(--acc);color:#111;border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row .btn{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1118f2;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut)}
nav button i{font-style:normal;font-size:22px}nav button.on{color:var(--acc)}
.over{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto}
.ohead{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#0b1118f2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:2}
.ohead div{display:flex;flex-direction:column}.ohead span{color:var(--mut);font-size:13px}
.back{font-size:30px;width:40px;height:40px;line-height:1;border-radius:10px;background:var(--card2)}
.obody{padding:14px 14px calc(40px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pics img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;background:#fff}
.piclab{display:grid;grid-template-columns:1fr 1fr;text-align:center;color:var(--mut);font-size:13px;margin:2px 0 4px}
ol,ul{padding-left:22px;margin:6px 0}li{margin:4px 0}ul.err li{color:#fca5a5}
.sets{margin:10px 0}.set{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.set.ok{background:#16261e;border-color:#2f5a3f}
.set .sn{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;flex:none}
.set label{flex:1;display:flex;flex-direction:column;align-items:center}
.set input{width:100%;font:600 20px Inter;text-align:center;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.set small{color:var(--mut);font-size:12px}
.set .chk{background:var(--acc);color:#111;font-weight:700;border-radius:10px;padding:12px;min-width:74px}.set.ok .chk{background:var(--ok)}
.rir small{color:var(--mut)}.pulse{animation:pu 1s 2}@keyframes pu{50%{border-color:var(--acc);box-shadow:0 0 0 3px #f9731655}}
.timer{position:fixed;inset:0;z-index:30;background:#0b1118f5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.timer .tl{font-size:22px;color:var(--mut)}.tn{font-size:96px;font-weight:700;line-height:1.1}.timer .row{width:100%;max-width:360px}
.tn.big{text-align:center;font-size:72px;color:var(--acc)}
.stretch{text-align:center}.simg{width:100%;max-width:440px;border-radius:14px;background:#fff;aspect-ratio:3/2;object-fit:cover}
.lado{display:inline-block;background:var(--acc);color:#111;font-weight:700;border-radius:99px;padding:3px 12px}
.sprog{height:6px;background:var(--card2);border-radius:9px;overflow:hidden}.sprog i{display:block;height:100%;background:var(--acc)}
.fuel .fl{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.fuel .fl b{color:var(--mut);font-weight:600}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}.form label{flex:1;min-width:90px;display:flex;flex-direction:column;font-size:13px;color:var(--mut)}
.form.col{flex-direction:column;align-items:stretch}
input,select,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{width:100%;min-height:80px;margin:8px 0}select{width:100%}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}.chips b{width:100%;font-size:14px;color:var(--mut)}
.supl label{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:17px}.supl input{width:22px;height:22px;accent-color:var(--acc)}.supl h4{margin-top:0}
.phases{position:relative;display:flex;height:14px;border-radius:9px;overflow:visible;gap:2px;margin:8px 0}.phases button{height:100%;border-radius:4px;padding:0}
.phases .mk{position:absolute;top:-6px;width:12px;height:26px;border-radius:4px;background:#fff;border:2px solid var(--bg)}
.phlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin-bottom:10px}.phlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}.weeknav div{display:flex;flex-direction:column;align-items:center}.weeknav span{color:var(--mut);font-size:14px}
.dayh{color:var(--mut);margin:14px 0 6px}.dayh.tod{color:var(--acc)}
.chart{width:100%;height:auto;margin-top:6px}.chart text{fill:var(--mut);font-size:10px}.chart .ln{fill:none;stroke:var(--acc);stroke-width:2.5}.chart .tgt{fill:none;stroke:#38bdf8;stroke-width:1.5;stroke-dasharray:5 4}.chart circle{fill:var(--acc)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin:0 4px 0 8px}.legend .l1{background:var(--acc)}.legend .l2{background:#38bdf8}
.big2{font-size:36px;font-weight:700}.big2 small{font-size:16px;color:var(--mut);font-family:Inter}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.x{color:var(--mut);padding:4px 8px}
.calh{display:flex;justify-content:space-between;align-items:center}.calh h4{margin:0;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center}.cal b{font-size:12px;color:var(--mut)}
.cd{background:var(--card2);border-radius:8px;padding:4px 0;min-height:42px;font-size:13px;opacity:.55}.cd.pl{opacity:1}.cd.tod{outline:2px solid var(--acc)}.cd.miss span{color:#f87171}
.cd div{display:flex;justify-content:center;gap:2px;margin-top:3px}
.cd i,.legend i.g,.legend i.o,.legend i.s{display:inline-block;width:8px;height:8px;border-radius:50%}.cd i.g,.legend i.g{background:var(--acc)}.cd i.o,.legend i.o{background:#38bdf8}.cd i.s,.legend i.s{background:#a78bfa}
details summary{cursor:pointer;font-weight:600;padding:2px 0}details .lib{margin-top:10px}
.modal{position:fixed;inset:0;background:#000a;z-index:40;display:grid;place-items:center;padding:20px}.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:380px;width:100%}
.zoom{position:fixed;inset:0;background:#000e;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}.zoom img{max-width:100%;border-radius:10px;background:#fff}.zoom p{color:var(--mut);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 6px 20px #0008;max-width:90%;text-align:center}
</style>
</head>
<body>
<main id="main"></main>
<nav>
  <button data-v="hoy"><i>🏠</i>Hoy</button>
  <button data-v="plan"><i>🗓️</i>Plan</button>
  <button data-v="prog"><i>📈</i>Progreso</button>
  <button data-v="nutri"><i>🍳</i>Nutrición</button>
  <button data-v="mas"><i>⚙️</i>Ajustes</button>
</nav>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
